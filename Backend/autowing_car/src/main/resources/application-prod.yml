# --- application-prod.yml ---
spring:
  config:
    activate:
      on-profile: master
  datasource:
    # 환경변수에서 주입받도록 수정
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # Redis 설정 (환경변수로 주입)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
