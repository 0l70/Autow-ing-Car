spring:
  config:
    activate:
      on-profile: prod # 'master' -> 'prod'로 변경 (가이드와 통일)
  datasource:
    # EC2 환경변수에서 주입
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # validate -> update (첫 배포 시 테이블 자동 생성 위해)
    # database-platform 삭제 (Spring Boot가 DB URL 보고 자동 감지)
    
  # Redis 설정 (환경변수)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mqtt:
    broker:
      url: ssl://${MQTT_HOST}:${MQTT_PORT}

app:
  mqtt:
    mock: false
