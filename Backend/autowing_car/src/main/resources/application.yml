# --- application.yml (공통) ---
spring:
  profiles:
    active: local # 기본은 로컬 개발 모드

---
# --- application-local.yml (H2 사용) ---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ats_db;MODE=PostgreSQL # Postgres 모드로 실행 (호환성 UP)
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop # 껐다 켜면 초기화 (개발용)
    show-sql: true
    properties:
      hibernate:
        format-sql: true
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 접속 가능

---
# --- application-prod.yml (PostgreSQL 사용) ---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://your-db-host:5432/ats_db
    username: your_user
    password: your_password
  jpa:
    hibernate:
      ddl-auto: validate # 운영에서는 스키마 변경 금지
    database-platform: org.hibernate.dialect.PostgreSQLDialect