spec:
  inputs:
    project_dir:
      type: string
      default: "Backend/autowing_car"
      description: "Backend 프로젝트의 상대 경로"
---
stages:
  - package
  - deploy

variables:
  BACKEND_DIR: "Backend/autowing_car"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: ""

# ---------------------------------------------------------------------------
# [1. Package Stage] - Docker build (Gradle build 포함)
# ---------------------------------------------------------------------------
backend-docker:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - Backend/**/*
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "📦 [Backend] Docker build (Gradle build inside Dockerfile)"
    - cd $BACKEND_DIR
    - docker build -t $BACKEND_IMAGE .
    - docker push $BACKEND_IMAGE

# ---------------------------------------------------------------------------
# [2. Deploy Stage] - EC2 배포
# ---------------------------------------------------------------------------
backend-deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - backend-docker
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - Backend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      echo "🚀 [Backend] Deploying to Production Server..."
      ssh ubuntu@$EC2_IP "
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' $CI_REGISTRY &&
        docker pull $BACKEND_IMAGE &&
        docker stop backend-app || true &&
        docker rm backend-app || true &&
        docker run -d --name backend-app \
          --network host \
          --restart always \
          -e SPRING_PROFILES_ACTIVE=local \
          # ===============================
          # DB 설정 (나중에 활성화)
          # ===============================
          # -e DB_URL='$DB_URL' \
          # -e DB_USERNAME='$DB_USERNAME' \
          # -e DB_PASSWORD='$DB_PASSWORD' \
          
          # ===============================
          # 또는 서버에 있는 env 파일 사용
          # ===============================
          # --env-file /home/ubuntu/backend.env \
          $BACKEND_IMAGE
      "
