spec:
  inputs:
    project_dir:
      type: string
      default: "Backend/autowing_car"
      description: "Backend 프로젝트의 상대 경로"
---
variables:
  BACKEND_DIR: "Backend/autowing_car"
  # ✅ [수정됨] 등록하신 변수명(BACKEND_DOCKER_...)을 사용하도록 변경
  BACKEND_IMAGE: $BACKEND_DOCKER_USERNAME/autowing-backend:$CI_COMMIT_SHORT_SHA

# ---------------------------------------------------------------------------
# [0. Test Stage]
# ---------------------------------------------------------------------------
backend-build-test:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      changes:
        - Backend/**/*
  script:
    - echo "🏗️ [Backend] Build Test"
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    - ./gradlew clean build -x test

# ---------------------------------------------------------------------------
# [1. Package Stage] - Docker build
# ---------------------------------------------------------------------------
backend-docker:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "dev"'
      changes:
        - Backend/**/*
  before_script:
    # ✅ [수정됨] 등록하신 변수명(BACKEND_DOCKER_...) 사용
    - echo "$BACKEND_DOCKER_PASSWORD" | docker login -u "$BACKEND_DOCKER_USERNAME" --password-stdin
  script:
    - echo "📦 [Backend] Docker build & Push"
    - cd $BACKEND_DIR
    - docker build --pull -t $BACKEND_IMAGE .
    - docker push $BACKEND_IMAGE

# ---------------------------------------------------------------------------
# [2. Deploy Stage] - EC2 배포
# ---------------------------------------------------------------------------
backend-deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - backend-docker
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "dev"'
      changes:
        - Backend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      echo "🚀 [Backend] Deploying..."
      ssh ubuntu@$EC2_IP "
        # ✅ [수정됨] 서버에서도 등록하신 변수명 사용
        echo '$BACKEND_DOCKER_PASSWORD' | docker login -u '$BACKEND_DOCKER_USERNAME' --password-stdin &&
        docker pull $BACKEND_IMAGE &&

        docker stop backend-app || true &&
        docker rm backend-app || true &&

        echo 'MQTT_HOST=autowingcar.o-r.kr' > deploy.env &&
        echo 'MQTT_PORT=8883' >> deploy.env &&
        echo 'JWT_SECRET=$JWT_SECRET' >> deploy.env &&
        echo 'JWT_EXPIRATION=86400000' >> deploy.env &&
        echo \"BACKEND_IMAGE=$BACKEND_IMAGE\" >> deploy.env &&

        docker run -d --name backend-app \
          --network app-network \
          --restart always \
          -p 8080:8080 \
          --env-file deploy.env \
          $BACKEND_IMAGE &&

        rm deploy.env &&
        docker image prune -f
      "
