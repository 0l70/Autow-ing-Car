stages:
  - build
  - package
  - deploy

variables:
  # 도커 이미지 이름 설정
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  JAVA_OPTS: "-Xmx512m" # 메모리 제한 (t2.micro 보호)

# 1. 빌드 단계 (Gradle Build)
build:
  stage: build
  image: gradle:8.5.0-jdk17
  script:
    - cd autowing_car # 백엔드 폴더로 이동 (경로 확인 필수!)
    - chmod +x gradlew
    - ./gradlew clean build -x test # 테스트 건너뛰기 (MVP 급할 때)
  artifacts:
    paths:
      - autowing_car/build/libs/*.jar
    expire_in: 1 day
  only:
    - develop # develop 브랜치에 푸시될 때만 실행
    - main

# 2. 패키징 단계 (Docker Build & Push)
docker-build:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd autowing_car
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - develop
    - main

# 3. 배포 단계 (EC2 접속 & 실행)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - ssh ubuntu@$EC2_IP "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $DOCKER_IMAGE &&
        docker stop backend-app || true &&
        docker rm backend-app || true &&
        docker run -d --name backend-app \
          --network host \
          -e PROFILE=prod \
          $DOCKER_IMAGE"
  only:
    - develop
    - main