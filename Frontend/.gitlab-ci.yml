spec:
  inputs:
    project_dir:
      type: string
      default: "Frontend"
      description: "Frontend Project Directory"
---
stages:
  - build
  - deploy

# ---------------------------------------------------------------------------
# 1. Frontend Build & Test (Runs on ALL branches)
#    - Purpose: Verify code compilation and check for errors
# ---------------------------------------------------------------------------
frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - echo "🚀 Starting Frontend Build Test..."
    - cd $[[ inputs.project_dir ]]
    - npm install -g pnpm
    - pnpm install --frozen-lockfile
    - pnpm run build
    - echo "✅ Build Successful!"
  artifacts:
    paths:
      - $[[ inputs.project_dir ]]/dist
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# 2. Docker Deploy (Runs ONLY on 'master' branch)
#    - Purpose: Build Docker image and push to registry for deployment
# ---------------------------------------------------------------------------
frontend-deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  needs: ["frontend-build"]
  script:
    - echo "🐳 Starting Docker Build & Push..."
    - cd $[[ inputs.project_dir ]]
    # Login to GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Build Image
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
    # Push Image
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - echo "🚀 Deployment Image Pushed Successfully!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
