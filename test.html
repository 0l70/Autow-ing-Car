<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Autowing Debug Console (V4.0)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root { --pilot-bg: #e3f2fd; --admin-bg: #e8f5e9; --border: #b0bec5; }
        body { font-family: 'Segoe UI', monospace; display: flex; gap: 15px; padding: 15px; background: #f5f5f5; height: 95vh; margin: 0; box-sizing: border-box; }
        
        .panel { flex: 1; display: flex; flex-direction: column; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.pilot { border-top: 5px solid #2196f3; }
        .panel.admin { border-top: 5px solid #4caf50; }
        
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; background: #eee; color: #999; }
        .status.on { background: #00e676; color: white; font-weight: bold; }

        .card { background: #fafafa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #e0e0e0; }
        .card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #555; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }

        input, button { width: 100%; padding: 8px; margin: 3px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px; }
        input:focus { outline: 2px solid #aaa; }
        input.autofilled { background-color: #fff9c4; transition: background 1s; }
        
        .row { display: flex; gap: 5px; }
        button { cursor: pointer; color: white; border: none; font-weight: bold; }
        button:hover { opacity: 0.9; }
        
        .btn-con { background: #607d8b; }
        .btn-req { background: #2196f3; }
        .btn-ok { background: #4caf50; }
        .btn-no { background: #f44336; }
        .btn-stop { background: #ff9800; }
        .btn-go { background: #8bc34a; }

        .log-window { flex: 1; overflow-y: auto; background: #212121; color: #eee; padding: 10px; font-size: 12px; border-radius: 4px; border: 1px solid #424242; }
        .log-item { border-bottom: 1px solid #333; padding: 2px 0; word-break: break-all; }
        .tm { color: #757575; margin-right: 5px; }
        
        /* Log Colors */
        .c-info { color: #4fc3f7; }
        .c-succ { color: #00e676; }
        .c-warn { color: #ffeb3b; }
        .c-err { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel pilot">
        <h2>👨‍✈️ PILOT <span id="pStatus" class="status">OFF</span></h2>
        
        <div class="card">
            <div class="row">
                <input type="text" id="pId" value="PILOT_01" placeholder="Pilot ID">
                <button class="btn-con" onclick="pilotCon()">연결</button>
            </div>
        </div>

        <div class="card">
            <h3>🛫 REQUEST</h3>
            <div class="row">
                <input type="text" id="dep" value="GATE_101" placeholder="Depart">
                <input type="text" id="dst" value="RUNWAY_A" placeholder="Dest">
            </div>
            <input type="number" id="fid" value="1" placeholder="Flight ID (Required)">
            <button class="btn-req" onclick="reqMission()">출발 요청</button>
        </div>

        <div class="card">
            <h3>🕹️ CONTROL</h3>
            <input type="text" id="ctlMid" placeholder="Mission ID (Auto)" readonly style="background:#eee;">
            <div class="row">
                <button class="btn-stop" onclick="sendCmd('PAUSE')">⛔ STOP</button>
                <button class="btn-go" onclick="sendCmd('RESUME')">▶ RUN</button>
            </div>
        </div>

        <div class="log-window" id="pLog"></div>
    </div>

    <div class="panel admin">
        <h2>🎧 ADMIN <span id="aStatus" class="status">OFF</span></h2>

        <div class="card">
            <div class="row">
                <input type="text" id="aId" value="ADMIN_MASTER" placeholder="Admin ID">
                <button class="btn-con" onclick="adminCon()">연결</button>
            </div>
        </div>

        <div class="card">
            <h3>✅ DECISION (Debug Mode)</h3>
            <input type="text" id="decMid" placeholder="Mission ID..." readonly style="background:#e0f2f1;">
            <input type="text" id="decCar" placeholder="Car Code...">
            <input type="text" id="decPath" placeholder='Path ["E1", "E2"]' style="font-size: 11px;">
            
            <div class="row" style="margin-top:5px;">
                <button class="btn-ok" onclick="decide(true)">승인</button>
                <button class="btn-no" onclick="decide(false)">반려</button>
            </div>
        </div>

        <div class="log-window" id="aLog"></div>
    </div>

    <script>
        const URL = 'http://localhost:8080/ws-server';
        let pClient = null;
        let aClient = null;

        // --- Logger ---
        function log(id, msg, type='info') {
            const el = document.getElementById(id);
            const tm = new Date().toLocaleTimeString('ko-KR',{hour12:false, minute:'2-digit', second:'2-digit'});
            el.innerHTML += `<div class="log-item"><span class="tm">[${tm}]</span><span class="c-${type}">${msg}</span></div>`;
            el.scrollTop = el.scrollHeight;
        }

        function highlight(id) {
            const el = document.getElementById(id);
            el.classList.add('autofilled');
            setTimeout(() => el.classList.remove('autofilled'), 1000);
        }

        // =======================
        // 1. 기장 (Pilot)
        // =======================
        function pilotCon() {
            const socket = new SockJS(URL);
            pClient = Stomp.over(socket);
            pClient.debug = null;

            const uid = document.getElementById('pId').value;
            const headers = { login: uid };

            pClient.connect(headers, frame => {
                document.getElementById('pStatus').innerText = "ON";
                document.getElementById('pStatus').classList.add('on');
                log('pLog', `Connected: ${uid}`, 'succ');

                pClient.subscribe('/user/queue/reply', msg => {
                    const body = JSON.parse(msg.body);
                    log('pLog', `📩 RECV: ${body.status} / ${body.message}`, 'info');
                    if(body.status === 'RUNNING' || body.missionId) {
                        document.getElementById('ctlMid').value = body.missionId;
                        highlight('ctlMid');
                    }
                });

                pClient.subscribe('/user/queue/errors', msg => log('pLog', `🔥 ERROR: ${msg.body}`, 'err'));
            }, err => log('pLog', `Connect Fail: ${err}`, 'err'));
        }

        function reqMission() {
            if(!pClient) return alert("연결 필요");
            const payload = {
                departNode: document.getElementById('dep').value,
                destNode: document.getElementById('dst').value,
                flightId: document.getElementById('fid').value
            };
            pClient.send("/app/mission/request", {}, JSON.stringify(payload));
            log('pLog', `📤 SEND Req (FID:${payload.flightId})`, 'info');
        }

        function sendCmd(cmd) {
            const mid = document.getElementById('ctlMid').value;
            if(!pClient || !mid) return alert("미션 ID 없음");
            const payload = { missionId: mid, command: cmd };
            pClient.send("/app/mission/control", {}, JSON.stringify(payload));
            log('pLog', `📤 CMD: ${cmd}`, 'warn');
        }

        // =======================
        // 2. 관제사 (Admin)
        // =======================
        function adminCon() {
            const socket = new SockJS(URL);
            aClient = Stomp.over(socket);
            aClient.debug = null;

            const uid = document.getElementById('aId').value;
            const headers = { login: uid };

            aClient.connect(headers, frame => {
                document.getElementById('aStatus').innerText = "ON";
                document.getElementById('aStatus').classList.add('on');
                log('aLog', `Connected: ${uid}`, 'succ');

                // ★ [핵심 디버깅 로직 포함]
                aClient.subscribe('/topic/admin/requests', msg => {
                    console.log("🔥 [RAW DATA RECEIVED]:", msg.body); // F12 콘솔 확인용

                    try {
                        // 1. JSON 파싱 시도
                        const data = JSON.parse(msg.body);
                        log('aLog', `🔔 RECV Request: Pilot=${data.pilotId}`, 'info');

                        // 2. 데이터 누락 체크
                        if(!data.missionId) log('aLog', '⚠️ missionId 필드 없음!', 'warn');
                        
                        // 3. Auto-Fill
                        document.getElementById('decMid').value = data.missionId;
                        highlight('decMid');

                        if(data.availableCars && data.availableCars.length > 0) {
                            document.getElementById('decCar').value = data.availableCars[0].carCode;
                            highlight('decCar');
                        } else {
                            log('aLog', '⚠️ availableCars 비어있음', 'warn');
                        }

                        if(data.pathOptions && data.pathOptions.length > 0) {
                            // DTO 필드명 확인 (edgeIds)
                            const edges = data.pathOptions[0].edgeIds || []; 
                            document.getElementById('decPath').value = JSON.stringify(edges);
                            highlight('decPath');
                        } else {
                            log('aLog', '⚠️ pathOptions 비어있음', 'warn');
                        }

                    } catch (e) {
                        // ★ 여기가 실행되면 서버가 JSON이 아닌 문자열을 보낸 것임!
                        console.error("JSON Parsing Error:", e);
                        log('aLog', `❌ PARSE FAIL: 데이터가 JSON 형식이 아님!`, 'err');
                        log('aLog', `[DATA]: ${msg.body.substring(0, 50)}...`, 'err');
                    }
                });

                aClient.subscribe('/topic/mission/updates', msg => {
                    const data = JSON.parse(msg.body);
                    log('aLog', `📢 UPDATE: Mission ${data.missionId} -> ${data.status}`, 'succ');
                });

            }, err => log('aLog', `Connect Fail: ${err}`, 'err'));
        }

        function decide(isApproved) {
            if(!aClient) return alert("연결 필요");
            const mid = document.getElementById('decMid').value;
            if(!mid) return alert("요청 대기중");

            let edgeIds = [];
            try {
                edgeIds = JSON.parse(document.getElementById('decPath').value || "[]");
            } catch(e) {
                return alert("경로 JSON 파싱 실패");
            }

            const payload = {
                missionId: mid,
                approved: isApproved,
                selectedCarCode: document.getElementById('decCar').value,
                selectedEdgeIds: edgeIds, 
                rejectReason: isApproved ? null : "Admin Reject"
            };

            aClient.send("/app/mission/decide", {}, JSON.stringify(payload));
            log('aLog', `📤 DECIDE: ${isApproved}`, isApproved ? 'succ' : 'err');
        }
    </script>
</body>
</html>
