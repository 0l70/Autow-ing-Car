stages:
  - notify

notify-mr-to-mattermost:
  stage: notify
  image: alpine/git:latest  # git과 curl이 있는 가벼운 이미지
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR일 때만 실행
  before_script:
    - apk add --no-cache curl jq # curl과 json 처리를 위한 jq 설치
  script:
    # 1. 타겟 브랜치 정보 가져오기 (커밋 차이를 비교하기 위해 필요)
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    
    # 2. 커밋 메시지 리스트 추출 (타겟 브랜치 ~ 현재 브랜치 사이의 커밋들)
    # 특수문자 오류 방지를 위해 jq로 안전하게 처리하는 것이 좋습니다.
    - |
      COMMITS=$(git log origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD --pretty=format:"- %s")
      MR_TITLE="$CI_MERGE_REQUEST_TITLE"
      MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
      AUTHOR="$GitLab_User_Name"

      # 메시지 본문 구성
      MESSAGE="#### :rocket: 새로운 MR이 도착했습니다!\n**제목:** [$MR_TITLE]($MR_URL)\n**작성자:** $GITLAB_USER_NAME\n\n**[포함된 커밋]**\n$COMMITS"

      # JSON Payload 생성 (jq를 사용해 특수문자 이스케이프 처리 자동화)
      PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{"text": $msg}')

      # Mattermost로 전송 (WEBHOOK_URL은 Settings > CI/CD > Variables에 등록하세요)
      curl -i -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" $MATTERMOST_WEBHOOK_URL